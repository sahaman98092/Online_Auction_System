{% extends "base.html" %}
{% block title %}Register - AuctionHub{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card animate-in">
        <h1><i class="fas fa-user-plus" style="color: var(--secondary);"></i> Create Account</h1>
        <p class="subtitle">Join AuctionHub and start bidding</p>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username *</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required minlength="3">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Your full name">
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 (555) 123-4567">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password *</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
    </div>
</div>
{% endblock %}
