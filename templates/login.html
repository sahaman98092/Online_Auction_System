{% extends "base.html" %}
{% block title %}Login - AuctionHub{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card animate-in">
        <h1><i class="fas fa-sign-in-alt" style="color: var(--primary);"></i> Welcome Back</h1>
        <p class="subtitle">Log in to your auction account</p>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                <i class="fas fa-sign-in-alt"></i> Log In
            </button>
        </form>
        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </p>
        <p class="auth-footer" style="margin-top: var(--space-sm); color: var(--text-muted); font-size: 0.75rem;">
            Demo: username <strong>admin</strong>, password <strong>admin123</strong>
        </p>
    </div>
</div>
{% endblock %}
